site_name: Mallard
site_description: Unstructured, GPU accelerated, high-order finite volume CFD solver
site_url: https://matthewbonanni.github.io/mallard/
repo_url: https://github.com/MatthewBonanni/mallard
repo_name: MatthewBonanni/mallard
edit_uri: ""
copyright: Mallard is open source under the Apache License 2.0.
docs_dir: content
site_dir: out

theme:
  name: material
  custom_dir: overrides
  logo: assets/icon.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

extra_javascript:
  - path: assets/media.js
    defer: true
  - path: assets/perf.js
    defer: true
  - path: assets/keys.js
    defer: true
  # Math (pymdownx.arithmatex): the configuration first, then MathJax itself
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

# Draws docs/dashboard.md from data/performance.json
hooks:
  - hooks/performance.py
  - hooks/content.py

plugins:
  - search
  - redirects:
      redirect_maps:
        docs/tutorial.md: docs/guide/first_simulation.md
        docs/parallel.md: docs/guide/parallel.md
        docs/performance.md: docs/guide/performance.md

extra:
  mallard_version: !ENV [MALLARD_VERSION, "dev"]
  # Set when the documentation pages come from a branch rather than the release (build.sh)
  docs_branch: !ENV [MALLARD_DOCS_BRANCH, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MatthewBonanni/mallard

validation:
  nav:
    # docs/api is generated by Doxygen after the MkDocs build
    not_found: info
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - docs/index.md
      - Installation: docs/installation.md
      - First simulation: docs/guide/first_simulation.md
      - Input files: docs/guide/input_files.md
  - User guide:
      - Meshes: docs/guide/meshes.md
      - Physics: docs/guide/physics.md
      - Thermochemistry: docs/guide/thermochemistry.md
      - Large-eddy simulation: docs/guide/les.md
      - Numerics: docs/guide/numerics.md
      - Boundary conditions: docs/guide/boundary_conditions.md
      - Sources and sponges: docs/guide/sources.md
      - Initialization and restarts: docs/guide/initialization.md
      - Output and diagnostics: docs/guide/output.md
      - Running in parallel: docs/guide/parallel.md
      - Performance: docs/guide/performance.md
      - Performance dashboard: docs/dashboard.md
      # New pages of docs/guide/ (pages.py)
      - GUIDE_EXTRA
  - Tutorials:
      # The pages of docs/tutorials/, index first (pages.py)
      - TUTORIALS
  - Theory manual:
      # The chapters of docs/theory/, in the order of its index (pages.py)
      - THEORY
  - Reference:
      - Input reference: docs/input.md
      - Numerical methods: docs/numerics/overview.md
      - TENO-E details: docs/numerics/teno_e.md
      - Tools: docs/tools.md
      - References: docs/references.md
      - API reference: docs/api/index.html
      - Developer notes:
          # The design notes of docs/design/ (pages.py)
          - DESIGN_NOTES
  - Examples: docs/examples.md
  - Validation: validation.md
  - Gallery: gallery.md
